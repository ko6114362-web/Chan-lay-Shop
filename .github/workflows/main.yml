name: Build Chan Shop APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Chan Shop APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platforms;android-35


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android Project
        run: |
          ls -la
          mkdir -p source
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" -not -path "./source/*" | head -n 1)
          echo "Found zip: $ZIP_FILE"
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No .zip file found in repository!"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d source
          find source -maxdepth 4 -name "gradlew"


      - name: Build APK
        run: |
          GRADLEW_PATH=$(find source -maxdepth 4 -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew not found inside source/"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Building inside: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chan Shop 
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
